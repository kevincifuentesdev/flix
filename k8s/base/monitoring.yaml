apiVersion: v1
kind: ConfigMap
metadata:
  name: flix-prometheus-config
  namespace: flix
  labels:
    app.kubernetes.io/name: flix-prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: flix
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: flix-backend
        metrics_path: /metrics
        static_configs:
          - targets: ["flix-backend.flix.svc.cluster.local:3000"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flix-prometheus
  namespace: flix
  labels:
    app.kubernetes.io/name: flix-prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: flix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flix-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flix-prometheus
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: flix
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=24h"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: flix-prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: flix-prometheus
  namespace: flix
  labels:
    app.kubernetes.io/name: flix-prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: flix
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9090
      targetPort: 9090
  selector:
    app.kubernetes.io/name: flix-prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flix-grafana-provisioning
  namespace: flix
  labels:
    app.kubernetes.io/name: flix-grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: flix
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://flix-prometheus:9090
        isDefault: true
        editable: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: flix-dashboards
        orgId: 1
        folder: Flix
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flix-grafana-dashboard
  namespace: flix
  labels:
    app.kubernetes.io/name: flix-grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: flix
data:
  flix-overview.json: |
    {
      "id": null,
      "uid": "flix-observability",
      "title": "Flix Backend & Database Observability",
      "tags": ["flix", "kubernetes", "prometheus"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "5s",
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "PostgreSQL Health",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 6 },
          "targets": [
            { "expr": "flix_database_up", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "HTTP Request Rate by Status (RPS)",
          "gridPos": { "x": 6, "y": 0, "w": 9, "h": 6 },
          "targets": [
            {
              "expr": "sum(rate(flix_http_requests_total[1m])) by (status_code)",
              "legendFormat": "HTTP {{status_code}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Backend Latency p95 (seconds)",
          "gridPos": { "x": 15, "y": 0, "w": 9, "h": 6 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(flix_http_request_duration_seconds_bucket[1m])) by (le))",
              "legendFormat": "p95 latency",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Node.js Memory (RSS vs Heap Used)",
          "gridPos": { "x": 0, "y": 6, "w": 12, "h": 7 },
          "targets": [
            {
              "expr": "flix_nodejs_process_resident_memory_bytes",
              "legendFormat": "RSS Bytes",
              "refId": "A"
            },
            {
              "expr": "flix_nodejs_nodejs_heap_size_used_bytes",
              "legendFormat": "Heap Used Bytes",
              "refId": "B"
            }
          ]
        },
        {
          "id": 5,
          "type": "bargauge",
          "title": "Requests by Route (last 5m)",
          "gridPos": { "x": 12, "y": 6, "w": 12, "h": 7 },
          "targets": [
            {
              "expr": "sum(increase(flix_http_requests_total[5m])) by (method, route, status_code)",
              "legendFormat": "{{method}} {{route}} ({{status_code}})",
              "refId": "A"
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flix-grafana
  namespace: flix
  labels:
    app.kubernetes.io/name: flix-grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: flix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flix-grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flix-grafana
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: flix
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 472
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: datasources
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: storage
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: datasources
          configMap:
            name: flix-grafana-provisioning
        - name: dashboards
          configMap:
            name: flix-grafana-dashboard
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: flix-grafana
  namespace: flix
  labels:
    app.kubernetes.io/name: flix-grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: flix
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app.kubernetes.io/name: flix-grafana
