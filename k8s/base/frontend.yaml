apiVersion: v1
kind: ConfigMap
metadata:
  name: flix-frontend-config
  namespace: flix
  labels:
    app.kubernetes.io/name: flix-frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: flix
data:
  NODE_ENV: production
  PORT: "5173"
  HOSTNAME: 0.0.0.0
  BACKEND: http://flix-backend:3000
  NEXT_PUBLIC_API_HOST: http://localhost:3000
  NEXT_PUBLIC_URL: http://localhost:5173
  TMDB_BASE_URL: https://api.themoviedb.org/3
  TMDB_IMAGE_BASE_URL: https://image.tmdb.org/t/p
  NEXT_PUBLIC_MUX_PLAYBACK_DOMAIN: stream.mux.com
  NEXT_PUBLIC_MUX_TEST_PLAYBACK_ID: demo-stream
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flix-frontend
  namespace: flix
  labels:
    app.kubernetes.io/name: flix-frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: flix
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: flix-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flix-frontend
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: flix
    spec:
      containers:
        - name: flix-frontend
          image: kevinmateog/flix-frontend:sha-72424f1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 5173
          envFrom:
            - configMapRef:
                name: flix-frontend-config
            - secretRef:
                name: flix-frontend-secret
                optional: true
          readinessProbe:
            httpGet:
              path: /login
              port: 5173
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /login
              port: 5173
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flix-frontend
  namespace: flix
  labels:
    app.kubernetes.io/name: flix-frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: flix
spec:
  type: NodePort
  ports:
    - name: http
      port: 5173
      targetPort: 5173
      nodePort: 30173
  selector:
    app.kubernetes.io/name: flix-frontend
