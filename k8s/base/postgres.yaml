apiVersion: v1
kind: ConfigMap
metadata:
  name: flix-postgres-config
  namespace: flix
  labels:
    app.kubernetes.io/name: flix-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: flix
data:
  POSTGRES_DB: flix
  POSTGRES_USER: flix_user
---
apiVersion: v1
kind: Service
metadata:
  name: flix-postgres
  namespace: flix
  labels:
    app.kubernetes.io/name: flix-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: flix
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: flix-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: flix-postgres
  namespace: flix
  labels:
    app.kubernetes.io/name: flix-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: flix
spec:
  serviceName: flix-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flix-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flix-postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: flix
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: flix-postgres-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flix-postgres-secret
                  key: POSTGRES_PASSWORD
                  optional: true
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
