# Secret template for local Minikube setup.
# Copy outside Git or create secrets imperatively with kubectl before deploying.
# Never commit real credentials or tokens to Git.
apiVersion: v1
kind: Secret
metadata:
  name: flix-postgres-secret
  namespace: flix
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-with-postgres-password
---
apiVersion: v1
kind: Secret
metadata:
  name: flix-backend-secret
  namespace: flix
type: Opaque
stringData:
  DATABASE_URL: postgresql://flix_user:replace-with-postgres-password@flix-postgres:5432/flix
  BETTER_AUTH_SECRET: replace-with-32-byte-secret
  TMDB_API_KEY: replace-with-tmdb-api-key
  TMDB_READ_ACCESS_TOKEN: replace-with-tmdb-read-access-token
  MUX_TOKEN_ID: replace-with-mux-token-id
  MUX_TOKEN_SECRET: replace-with-mux-token-secret
  AWS_ENDPOINT_URL_S3: replace-with-s3-endpoint
  AWS_ACCESS_KEY_ID: replace-with-aws-access-key-id
  AWS_SECRET_ACCESS_KEY: replace-with-aws-secret-access-key
---
apiVersion: v1
kind: Secret
metadata:
  name: flix-frontend-secret
  namespace: flix
type: Opaque
stringData:
  TMDB_API_KEY: replace-with-tmdb-api-key
