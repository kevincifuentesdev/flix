apiVersion: v1
kind: ConfigMap
metadata:
  name: flix-backend-config
  namespace: flix
  labels:
    app.kubernetes.io/name: flix-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: flix
data:
  NODE_ENV: production
  PORT: "3000"
  FRONTEND_URL: http://localhost:5173
  BACKEND_URL: http://localhost:3000
  BETTER_AUTH_URL: http://localhost:3000
  BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
  TMDB_BASE_URL: https://api.themoviedb.org/3
  TMDB_IMAGE_BASE_URL: https://image.tmdb.org/t/p
  PUBLIC_MUX_PLAYBACK_DOMAIN: stream.mux.com
  AWS_REGION: us-east-2
  AVATARS_BUCKET: avatars
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flix-backend
  namespace: flix
  labels:
    app.kubernetes.io/name: flix-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: flix
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: flix-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flix-backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: flix
    spec:
      containers:
        - name: flix-backend
          image: kevinmateog/flix-backend:sha-c7316c7
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: flix-backend-config
            - secretRef:
                name: flix-backend-secret
                optional: true
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flix-backend
  namespace: flix
  labels:
    app.kubernetes.io/name: flix-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: flix
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app.kubernetes.io/name: flix-backend
